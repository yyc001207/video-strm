<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>video-strm 任务调度</title>
    <script>
      // 首屏主题预加载：在 Vue 挂载前按 localStorage / 系统偏好设置 html.dark，避免闪白
      ;(function () {
        try {
          var saved = localStorage.getItem('video-strm-theme')
          var dark =
            saved === 'dark' ||
            ((!saved || saved === 'auto') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
